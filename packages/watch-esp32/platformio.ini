; ============================================================
; PlatformIO Configuration — LILYGO T-Watch S3
; Framework : Arduino (ESP32 Arduino Core v2.x)
; Board     : ESP32-S3 (16MB Flash, 8MB PSRAM OPI)
; ============================================================

[env:twatch_s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Board overrides ---
board_build.mcu                    = esp32s3
board_build.f_cpu                  = 240000000L
board_build.flash_mode             = qio
board_build.flash_size             = 16MB
board_build.partitions             = default_16MB.csv
board_build.filesystem             = littlefs
board_upload.flash_size            = 16MB
; PSRAM OPI (correct pour ESP32-S3 — remplace -mfix-esp32-psram-cache-issue)
board_build.arduino.memory_type    = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

; --- Upload / Monitor ---
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, colorize

; --- Libraries ---
lib_deps =
    ; Display — LovyanGFX (plus fiable que TFT_eSPI sur ESP32-S3, host SPI explicite)
    lovyan03/LovyanGFX @ ^1.1.16
    ; Power management (AXP2101)
    lewisxhe/XPowersLib @ ^0.2.5
    ; WiFi helpers
    bblanchon/ArduinoJson @ ^7.3.1

[env:twatch_s3_debug]
extends     = env:twatch_s3
build_type  = debug
build_flags =
    ${env:twatch_s3.build_flags}
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=5
