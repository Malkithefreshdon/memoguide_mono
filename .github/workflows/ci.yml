name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Dashboard Nuxt ─────────────────────────────────────────────────────
  dashboard:
    name: "Dashboard (Nuxt)"
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[all]') ||
      github.event_name == 'push' && contains(toJson(github.event.commits.*.modified), 'packages/dashboard-nuxt')
    defaults:
      run:
        working-directory: packages/dashboard-nuxt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dashboard-nuxt/package-lock.json

      - run: npm ci
      - run: npm run build

  # ── Gateway Python ─────────────────────────────────────────────────────
  gateway:
    name: "Gateway (Python)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gateway-rpi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt yet"

      - name: Lint
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=__pycache__ || true

  # ── ESP32 PlatformIO ───────────────────────────────────────────────────
  watch-esp32:
    name: "Watch ESP32 (PlatformIO)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/watch-esp32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('packages/watch-esp32/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

  # ── nRF / Zephyr ───────────────────────────────────────────────────────
  watch-nrf:
    name: "Watch nRF (Zephyr)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.13
    defaults:
      run:
        working-directory: packages/watch-nrf
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: West init & update
        run: |
          pip install west
          west init -l .
          west update --narrow

      - name: Build Zephyr firmware
        run: west build -b nrf5340dk/nrf5340/cpuapp --pristine
